# date: 12/17/2024
date: today
date-format: "DD.MM.YYYY"
format:
    revealjs-light:
      slide-number: true
      theme: [default, styles.scss]
      footer: "BFH School of Health Professions"
      # logo: "../images/BFH_Logo_A_en_100_RGB.svg"
      # chalkboard: true # only works when not embedding resources
      template-partials:
        - title-slide.html
      html-math-method: mathjax
      include-in-header:
        text: |
          <script>
          window.MathJax = {
            loader: {
              load: ['[custom]/siunitx.js', '[tex]/html', '[tex]/gensymb'],
              paths: { custom: './assets/' }
            },
            tex: {
              packages: { '[+]': ['siunitx', 'html', 'gensymb'] },
              siunitx: {
                'per-mode': 'power'
              }
            }
          };
          </script>
    revealjs-dark:
      slide-number: true
      theme: [dark, styles.scss]
      footer: "BFH School of Health Professions"
      # logo: "../images/BFH_Logo_A_en_100_RGB.svg"
      # chalkboard: true # only works when not embedding resources
      template-partials:
        - title-slide.html
      html-math-method: mathjax
      include-in-header:
        text: |
          <script>
          window.MathJax = {
            loader: {
              load: ['[custom]/siunitx.js', '[tex]/html', '[tex]/gensymb'],
              paths: { custom: './assets/' }
            },
            tex: {
              packages: { '[+]': ['siunitx', 'html', 'gensymb'] },
              siunitx: {
                'per-mode': 'power'
              }
            }
          };
          </script>
embed-resources: true

bibliography: bibliography.bib

